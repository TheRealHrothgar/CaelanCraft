<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caelancraft art pilot</title>
    <!-- A dev-only page (npx vite, then /gallery.html): the art-direction pilot next to today's models. `npm run build`
         builds index.html only. ?row=avatar|zombie|animal|plant|hand|all -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #b9d2ea; font: 13px/1.3 system-ui, sans-serif; color: #1d2a36; }
      canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
      #labels { position: fixed; inset: 0; pointer-events: none; }
      .lab { position: absolute; padding: 2px 7px; border-radius: 6px; background: rgba(255, 255, 255, 0.78); white-space: nowrap; }
      .lab.head { font-weight: 700; font-size: 15px; }
      .lab.stat { font-size: 12px; color: #34414d; }
      .lab.view { font-size: 11px; background: rgba(20, 30, 40, 0.55); color: #fff; }
      #title { position: fixed; left: 12px; top: 8px; font-weight: 700; font-size: 17px; pointer-events: none; }
      #title span { font-weight: 400; font-size: 13px; color: #34414d; margin-left: 10px; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="labels"></div>
    <div id="title"></div>
    <script type="module" src="/src/gallery.js"></script>
  </body>
</html>
